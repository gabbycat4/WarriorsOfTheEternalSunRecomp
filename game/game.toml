[game]
output_prefix = "wotes"
# Table-driven game with no disassembly: let the recompiler walk pcrel16 jump
# tables (validator-gated), as RKA and Puyo do.
jump_table_autodiscovery = true
# Validated interpreter-floor roots (tools/fold_floor.py; gate: tools/compare_native.py).
discovery_files = ["wotes_floor_fold.discovery.toml"]

[ram_layout]
game_mode      = 0x000000     # unknown (cosmetic): refine later
vint_runcount  = 0x000000     # candidate $FF8004 (byte): confirm before setting
vint_routine   = 0x000000     # unknown: candidate RAM pointer $FF8000
plc_pending    = 0x000000     # no Sonic-style PLC system
initial_ssp    = 0xFFFFFFF6   # reset SSP from the vector table (LOAD-BEARING)
vbla_stack     = 0xFFFFFFF6   # V-int handler stack base (LOAD-BEARING)
intr_stack     = 0xFFFFFFF6   # IRQ handler stack base (LOAD-BEARING)
player_object  = 0x000000     # unknown (cosmetic)
level_modes    = []

[functions]
extra = [0x000200, 0x0009E6]
late_extra = []
